<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusPath Technologies - Strategy Workspace</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone for JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons Bundle -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Safe Lucide Icon Shim to prevent rendering crashes
    const SafeIcon = ({ name, className = "w-5 h-5 inline-block" }) => {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [name]);

      return <i data-lucide={name.toLowerCase()} className={className}></i>;
    };

    // Main App Component
    const App = () => {
      const [activeStage, setActiveStage] = useState(1);
      const [messages, setMessages] = useState([
        { sender: 'ai', text: 'Welcome to CampusPath Strategy Advisor! We are in Stage 1: company.md. How can I guide your profile setup?' }
      ]);
      const [input, setInput] = useState('');

      const stages = [
        { id: 1, name: 'company.md', label: 'Company Profile & Vision' },
        { id: 2, name: 'market.md', label: 'Market Context & Bottlenecks' },
        { id: 3, name: 'problem initial guess.md', label: 'Enrollment Pain Points' },
        { id: 4, name: 'product initial guess.md', label: 'Workflow Architecture' },
        { id: 5, name: 'PRD & Final Mapping', label: 'Final Requirements' }
      ];

      const handleSend = () => {
        if (!input.trim()) return;
        const userMsg = { sender: 'user', text: input };
        setMessages(prev => [...prev, userMsg]);
        setInput('');

        setTimeout(() => {
          setMessages(prev => [
            ...prev,
            { sender: 'ai', text: `[Stage ${activeStage} Context]: Received your input regarding CampusPath strategy. Proceeding with workflow mapping.` }
          ]);
        }, 600);
      };

      return (
        <div class="p-6 max-w-7xl mx-auto space-y-6">
          {/* Header */}
          <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl flex justify-between items-center">
            <div>
              <h1 class="text-2xl font-bold text-indigo-400 flex items-center gap-2">
                <SafeIcon name="layers" className="w-6 h-6 text-indigo-400" />
                CampusPath Technologies | Strategy Workspace
              </h1>
              <p class="text-slate-400 text-sm mt-1">Structured 5-Stage Higher-Ed Product Strategy Mapping</p>
            </div>
            <div class="text-right">
              <span class="text-xs uppercase tracking-wider text-slate-400">Total Completion</span>
              <div class="text-2xl font-bold text-indigo-300">{(activeStage / 5) * 100}%</div>
            </div>
          </div>

          {/* Navigation Pipeline */}
          <div class="grid grid-cols-5 gap-2">
            {stages.map(s => (
              <button
                key={s.id}
                onClick={() => setActiveStage(s.id)}
                class={`p-3 rounded-lg text-left border transition-all ${
                  activeStage === s.id
                    ? 'bg-indigo-600 border-indigo-400 text-white shadow-lg'
                    : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'
                }`}
              >
                <div class="text-xs font-semibold uppercase">Stage {s.id}</div>
                <div class="text-sm font-bold truncate">{s.name}</div>
              </button>
            ))}
          </div>

          {/* Split Workspace */}
          <div class="grid grid-cols-12 gap-6">
            {/* Left Dashboard Panel */}
            <div class="col-span-7 space-y-6">
              <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
                <h2 class="text-lg font-semibold text-slate-200 flex items-center gap-2">
                  <SafeIcon name="file-text" /> Active Workspace: {stages[activeStage - 1].name}
                </h2>
                <p class="text-slate-400 text-sm">{stages[activeStage - 1].label}</p>
                
                {/* File Vault */}
                <div class="border-2 border-dashed border-slate-600 p-4 rounded-lg text-center bg-slate-900/50">
                  <SafeIcon name="upload-cloud" className="w-8 h-8 text-slate-400 mx-auto mb-2" />
                  <p class="text-sm text-slate-300">Upload source files for Stage {activeStage}</p>
                  <input type="file" class="mt-2 text-xs text-slate-400" />
                </div>
              </div>
            </div>

            {/* Right Active Chat Panel */}
            <div class="col-span-5 bg-slate-800 rounded-xl border border-slate-700 flex flex-col h-[480px]">
              <div class="p-4 border-b border-slate-700 flex items-center justify-between">
                <span class="font-semibold text-sm flex items-center gap-2">
                  <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                  CampusPath AI Advisor
                </span>
                <span class="text-xs text-slate-400">Context: Stage {activeStage}</span>
              </div>

              {/* Messages Window */}
              <div class="flex-1 p-4 overflow-y-auto space-y-3">
                {messages.map((m, idx) => (
                  <div key={idx} class={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                    <div class={`max-w-[85%] text-sm p-3 rounded-xl ${
                      m.sender === 'user'
                        ? 'bg-indigo-600 text-white rounded-br-none'
                        : 'bg-slate-700 text-slate-200 rounded-bl-none'
                    }`}>
                      {m.text}
                    </div>
                  </div>
                ))}
              </div>

              {/* Chat Input Bar */}
              <div class="p-3 border-t border-slate-700 flex gap-2">
                <input
                  type="text"
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && handleSend()}
                  placeholder="Ask advisor or type specification..."
                  class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
                />
                <button
                  onClick={handleSend}
                  class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-all"
                >
                  Send
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // Render App Component to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
